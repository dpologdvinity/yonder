version: 2

builds:
  - env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

release:
  github:
    owner: dpologdvinity
    name: yonder

nfpms:
  - package_name: yonder
    file_name_template: "{{ .ConventionalFileName }}"
    homepage: https://github.com/dpologdvinity/yonder
    maintainer: Kaitlyn Bassford <dpologdvinity@users.noreply.github.com>
    description: "your site, over yonder: share a localhost site or files with your phone via a QR code"
    license: MIT
    formats: [deb, rpm]
    bindir: /usr/bin

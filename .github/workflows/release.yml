# Release workflow. Pushing a tag such as v0.5.0 publishes that version everywhere:
#
#   verify  - refuses to continue unless the ci workflow passed for the tagged commit
#   release - builds binaries, .deb, .rpm and Arch packages, and publishes the GitHub release
#   pypi    - builds one wheel per platform from the release files and uploads them to PyPI
#   npm     - publishes the npm wrapper package
#
# PyPI and npm use "trusted publishing": they check this workflow's identity, so no token is
# stored anywhere. The Homebrew, Scoop, apt, dnf and pacman repositories are separate
# repositories that update themselves hourly from the GitHub release (see ARCHITECTURE.md).
#
# One-time owner setup (PyPI and npm trusted publishers) is described in STEPS-FOR-OWNER.md.

name: release

on:
  push:
    tags: ["v*"]

# Nothing may write unless a job asks for it below.
permissions:
  contents: read

jobs:
  verify:
    name: ci passed for this commit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    steps:
      - name: Wait for the ci workflow and require that it passed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in $(seq 1 50); do
            state=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" \
              --limit 1 --json status,conclusion --jq '.[0] // empty | "\(.status) \(.conclusion)"')
            case "$state" in
              "completed success")
                echo "ci passed for $GITHUB_SHA"
                exit 0
                ;;
              completed*)
                echo "ci did not pass for $GITHUB_SHA ($state). Fix it, then tag a new commit."
                exit 1
                ;;
              "")
                echo "No ci run for $GITHUB_SHA yet. Tag a commit that was pushed to the default branch."
                ;;
              *)
                echo "ci is still running ($state)"
                ;;
            esac
            sleep 30
          done
          echo "Timed out waiting for ci"
          exit 1

  release:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # create the release and upload its files
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # goreleaser reads the tag history
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        with:
          distribution: goreleaser
          version: "v2.19.0"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  pypi:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      contents: read
      id-token: write # lets PyPI verify this workflow's identity
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
      - run: python pypi/build_wheels.py "${GITHUB_REF_NAME#v}" dist-pypi
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: dist-pypi

  npm:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # lets npm verify this workflow's identity and sign the provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - working-directory: npm
        run: |
          npm version --no-git-tag-version "${GITHUB_REF_NAME#v}"
          npm publish --access public --provenance
